name: Demo workflow manual

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Mensaje a imprimir por consola"
        required: true
        default: "Hola desde GitHub Actions"

jobs:
  imprimir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir mensaje
        run: echo "${{ github.event.inputs.mensaje }}"